name: Publicar Kora en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio publico
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'api/' \
            --exclude 'supabase/' \
            --exclude 'anatomy/' \
            --exclude 'Catalogo/' \
            --exclude 'Solicitud clientes/' \
            --exclude 'scripts/' \
            --exclude '*.env' \
            --exclude '*.md' \
            --exclude '*.sql' \
            --exclude 'server.mjs' \
            --exclude 'start-analisis.ps1' \
            ./ _site/
          printf 'kora3d.co\n' > _site/CNAME

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
