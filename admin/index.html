<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pedidos · Kora Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="./css/base.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script>
  <script defer src="../config.js"></script>
  <script type="module">
    const app = document.getElementById("app");
    import("./js/main.js?v=20261110-startupfix").catch((error) => {
      if (!app) return;
      delete app.dataset.boot;
      app.replaceChildren();
      const shell = document.createElement("main");
      shell.className = "ds-container ds-auth";
      const card = document.createElement("section");
      card.className = "ds-card ds-stack";
      const title = document.createElement("h1");
      title.className = "ds-h2";
      title.textContent = "No se pudo cargar el panel";
      const detail = document.createElement("p");
      detail.className = "ds-text-muted";
      detail.textContent = error?.message || "Falló la carga de los módulos del admin.";
      const retry = document.createElement("button");
      retry.className = "ds-btn ds-btn--primary";
      retry.textContent = "Reintentar";
      retry.addEventListener("click", () => location.reload());
      card.append(title, detail, retry);
      shell.append(card);
      app.append(shell);
    });
  </script>
</head>
<body class="ds-root">
  <div id="app" data-boot="true">
    <main class="ds-container ds-auth" role="status">
      <section class="ds-card ds-stack"><h1 class="ds-h2">Abriendo el panel de Kora</h1><p class="ds-text-muted">Conectando con el servicio seguro…</p></section>
    </main>
  </div>
  <script>
    window.setTimeout(() => {
      const app = document.getElementById("app");
      if (app?.dataset.boot === "true") {
        app.textContent = "El panel no pudo cargar sus archivos. Recarga la página; si continúa, revisa la consola o despliegue de GitHub Pages.";
      }
    }, 12000);
  </script>
</body>
</html>
